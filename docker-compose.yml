services:
  # Proxy inverso con Nginx
  proxy:
    image: nginx:alpine
    container_name: grupo3-proxy
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/usr/share/nginx/html:ro
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    depends_on:
      - moodle
      - wordpress
      - hangman
    networks:
      - proyecto
    restart: unless-stopped

  # Base de datos MariaDB
  mariadb:
    image: mariadb:11
    container_name: grupo3-mariadb
    environment:
      MYSQL_ROOT_PASSWORD: cc5308
      MYSQL_DATABASE: moodle_db
      MYSQL_USER: moodle_user
      MYSQL_PASSWORD: moodle_pass
    volumes:
      - dbdata:/var/lib/mysql
      - ./mariadb/init:/docker-entrypoint-initdb.d:ro
    networks:
      - proyecto
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Moodle LMS
  moodle:
    build: ./moodle
    container_name: grupo3-moodle
    environment:
      MOODLE_DATABASE_HOST: mariadb
      MOODLE_DATABASE_USER: moodle_user
      MOODLE_DATABASE_PASSWORD: moodle_pass
      MOODLE_DATABASE_NAME: moodle_db
      MOODLE_URL: "https://grupo3.ifigueroap.cl/moodle"

    volumes:
      - moodledata:/var/moodledata
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - proyecto
    restart: unless-stopped

  # WordPress CMS
  wordpress:
    build: ./wordpress
    container_name: grupo3-wordpress
    environment:
      WORDPRESS_DB_HOST: mariadb:3306
      WORDPRESS_DB_USER: wp_user
      WORDPRESS_DB_PASSWORD: wp_pass
      WORDPRESS_DB_NAME: wp_db
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'https://grupo3.ifigueroap.cl/wp');
        define('WP_SITEURL', 'https://grupo3.ifigueroap.cl/wp');
        define('FORCE_SSL_ADMIN', true);
    volumes:
      - wordpress_data:/var/www/html
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - proyecto
    restart: unless-stopped

  # Aplicación Hangman (App personalizada)
  hangman:
    build: ./app
    container_name: grupo3-hangman
    environment:
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_USER=hangman_user
      - DB_PASSWORD=hangman_pass
      - DB_NAME=hangman_db
      - PORT=3000
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - proyecto
    restart: unless-stopped

volumes:
  dbdata:
  moodledata:
  wordpress_data:

networks:
  proyecto:
    external: true
    name: proyecto
