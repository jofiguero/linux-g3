events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 100M;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Upstreams (Backend definitions)
    upstream moodle_backend {
        server moodle:80;
    }

    upstream wordpress_backend {
        server wordpress:80;
    }

    upstream hangman_backend {
        server hangman:3000;
    }

    server {
        listen 80;
        server_name grupo3.ifigueroap.cl;
        
        root /usr/share/nginx/html;
        index index.html;

        # Certbot ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Página de inicio
        location = / {
            try_files $uri $uri/ /index.html;
        }

        # --- BLOQUE ELIMINADO ---
        # El bloque de estáticos global rompía la carga de assets de los contenedores.
        # Al quitarlo, Nginx respeta las locations específicas (/app/, /wp/, etc).
        
        # Moodle
        location /moodle/ {
            proxy_pass http://moodle_backend/moodle/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 600;
            proxy_send_timeout 600;
            proxy_read_timeout 600;
        }

        # WordPress
        location /wp/ {
            proxy_pass http://wordpress_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Hangman App
        location /app/ {
            proxy_pass http://hangman_backend/; 
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # HTTPS Server
    server {
        listen 443 ssl;
        server_name grupo3.ifigueroap.cl;
        
        ssl_certificate /etc/letsencrypt/live/grupo3.ifigueroap.cl/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/grupo3.ifigueroap.cl/privkey.pem;
        
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        
        root /usr/share/nginx/html;
        index index.html;

        # Página de inicio
        location = / {
            try_files $uri $uri/ /index.html;
        }

        # Moodle
        location /moodle/ {
            proxy_pass http://moodle_backend/moodle/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            
            proxy_connect_timeout 600;
            proxy_send_timeout 600;
            proxy_read_timeout 600;
        }

        # WordPress
        location /wp/ {
            proxy_pass http://wordpress_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Hangman App
        location /app/ {
            proxy_pass http://hangman_backend/; 
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}