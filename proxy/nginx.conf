events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 100M;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Backend para Moodle
    upstream moodle_backend {
        server moodle:80;
    }

    # Backend para WordPress
    upstream wordpress_backend {
        server wordpress:80;
    }

    # Backend para Hangman App
    upstream hangman_backend {
        server hangman:3000;
    }

    server {
        listen 80;
        server_name localhost grupo3.ifigueroap.cl;
        
        root /usr/share/nginx/html;
        index index.html;

        # Certbot (solo para producción con HTTPS)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Página de inicio
        location = / {
            try_files $uri $uri/ /index.html;
        }

        # Archivos estáticos (CSS, JS, imágenes)
        location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg)$ {
            expires 1d;
            add_header Cache-Control "public, immutable";
        }

        # Moodle
        location /moodle/ {
            proxy_pass http://moodle_backend/moodle/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts para operaciones largas
            proxy_connect_timeout 600;
            proxy_send_timeout 600;
            proxy_read_timeout 600;
        }

        # WordPress
        location /wp/ {
            proxy_pass http://wordpress_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Hangman App
        location /app/ {
            proxy_pass http://hangman_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
