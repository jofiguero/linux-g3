events {
    worker_connections 1024;
}

http {
    # Configuración básica
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 100M;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Upstream para Moodle
    upstream moodle_backend {
        server moodle:80;
    }

    # Upstream para WordPress
    upstream wordpress_backend {
        server wordpress:80;
    }

    # Servidor HTTP (redirige a HTTPS en producción, pero en local funciona directo)
    server {
        listen 80;
        server_name localhost grupo3.ifigueroap.cl;

        # Para certbot (solo necesario en producción)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Moodle en /moodle/
        location /moodle/ {
            proxy_pass http://moodle_backend/moodle/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            
            # Timeouts largos para Moodle
            proxy_connect_timeout 600;
            proxy_send_timeout 600;
            proxy_read_timeout 600;
            send_timeout 600;
        }

        # WordPress en /wp/
        location /wp/ {
            proxy_pass http://wordpress_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        # Ruta raíz - página de bienvenida
        location = / {
            return 200 '<html><head><title>Grupo3 - Proyecto Linux</title></head><body><h1>Bienvenido al Proyecto Grupo3</h1><ul><li><a href="/moodle/">Moodle</a></li><li><a href="/wp/">WordPress</a></li></ul></body></html>';
            add_header Content-Type text/html;
        }
    }
}
