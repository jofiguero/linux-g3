events {
    worker_connections 1024;
}

http {
    # Configuración básica
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 100M;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Upstream para Moodle
    upstream moodle_backend {
        server moodle:80;
    }

    # Upstream para WordPress
    upstream wordpress_backend {
        server wordpress:80;
    }

    # Servidor HTTP (redirige a HTTPS en producción, pero en local funciona directo)
    server {
        listen 80;
        server_name localhost grupo3.ifigueroap.cl;

        # Para certbot (solo necesario en producción)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Moodle en /moodle/
        location /moodle/ {
            proxy_pass http://moodle_backend/moodle/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            
            # Timeouts largos para Moodle
            proxy_connect_timeout 600;
            proxy_send_timeout 600;
            proxy_read_timeout 600;
            send_timeout 600;
        }

        # WordPress en /wp/
        location /wp/ {
            proxy_pass http://wordpress_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        # Ruta raíz - página de bienvenida
        location = / {
            return 200 '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Grupo3 - Proyecto Linux</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:"Courier New",monospace;background:#0a0e27;color:#00ff41;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}.container{background:#1a1f3a;padding:40px;border-radius:20px;box-shadow:0 0 30px rgba(0,255,65,0.3),inset 0 0 20px rgba(0,255,65,0.1);max-width:700px;width:100%;border:2px solid #00ff41}h1{color:#00ff41;text-align:center;margin-bottom:10px;font-size:2.2em;text-shadow:0 0 10px #00ff41;letter-spacing:2px}p{text-align:center;margin-bottom:30px;color:#00cc33;font-size:1.1em}ul{list-style:none;padding:0;margin-bottom:40px}li{margin:20px 0}a{display:block;padding:20px;background:linear-gradient(135deg,#0f4d2e 0%,#1a6b3f 100%);color:#00ff41;text-decoration:none;border-radius:15px;text-align:center;font-size:1.3em;font-weight:bold;transition:all 0.3s;border:2px solid #00ff41;box-shadow:0 0 15px rgba(0,255,65,0.2);letter-spacing:1px}a:hover{background:linear-gradient(135deg,#1a6b3f 0%,#0f4d2e 100%);box-shadow:0 0 25px rgba(0,255,65,0.5);transform:translateY(-3px);color:#00ff88}.integrantes{margin-top:30px;padding-top:20px;border-top:2px solid #00ff41;text-align:center}.integrantes h3{color:#00ff41;margin-bottom:15px;font-size:1.2em;text-shadow:0 0 8px #00ff41}.integrantes ul{margin-bottom:0}.integrantes li{margin:8px 0}.integrantes li::before{content:"> ";color:#00ff41}.member{color:#00cc33;font-size:1em}.footer{position:fixed;bottom:20px;right:20px;background:#1a1f3a;padding:15px 25px;border-radius:15px;border:2px solid #00ff41;box-shadow:0 0 20px rgba(0,255,65,0.3);color:#00ff41;font-weight:bold;font-size:0.9em;text-shadow:0 0 5px #00ff41}</style></head><body><div class="container"><h1>~ GRUPO 3 ~</h1><p>[ Selecciona la plataforma que deseas utilizar ]</p><ul><li><a href="/moodle/">► MOODLE</a></li><li><a href="/wp/">► WORDPRESS</a></li></ul><div class="integrantes"><h3>INTEGRANTES:</h3><ul><li class="member">Benjamín Ureta</li><li class="member">Joaquín Figueroa</li><li class="member">Joaquín Harcha</li><li class="member">José Villalobos</li><li class="member">Víctor Alfaro</li></ul></div></div><div class="footer">CC5308<br>Administración de Sistemas Linux</div></body></html>';
            add_header Content-Type text/html;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
    }
}
