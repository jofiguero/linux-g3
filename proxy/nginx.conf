events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 100M;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Upstreams (Backend definitions)
    upstream moodle_backend {
        server moodle:80;
    }

    upstream wordpress_backend {
        server wordpress:80;
    }

    upstream hangman_backend {
        server hangman:3000;
    }

    server {
        listen 8080;
        server_name grupo3.ifigueroap.cl;
        
        root /usr/share/nginx/html;
        index index.html;

        # Certbot
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Página de inicio
        location = / {
            return 301 https://$host:8443$request_uri;
        }

        # --- BLOQUE ELIMINADO ---
        # El bloque de estáticos global rompía la carga de assets de los contenedores.
        # Al quitarlo, Nginx respeta las locations específicas (/app/, /wp/, etc).
        
        # Moodle
        location /moodle/ {
            proxy_pass http://moodle_backend/moodle/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 600;
            proxy_send_timeout 600;
            proxy_read_timeout 600;
        }

        # WordPress
        location /wp/ {
            proxy_pass http://wordpress_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Hangman App
        location /app/ {
            # Nota la barra al final: Nginx quitará "/app/" de la URL
            # Express recibirá "/vite.svg" en lugar de "/app/vite.svg"
            # (Tu código app.ts ya está preparado para esto con la "Estrategia Dual")
            proxy_pass http://hangman_backend/; 
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
       listen 8443 ssl;
       server_name grupo3.ifigueroap.cl;

       ssl_certificate /etc/letsencrypt/live/grupo3.ifigueroap.cl/fullchain.pem;
       ssl_certificate_key /etc/letsencrypt/live/grupo3.ifigueroap.cl/privkey.pem;

    # Moodle
       location /moodle/ {
        proxy_pass http://moodle_backend/;
        include /etc/nginx/proxy_params;
        }

    # Wordpress
       location /wp/ {
        proxy_pass http://wordpress_backend/;
        include /etc/nginx/proxy_params;
    }

     # App
       location /app/ {
        proxy_pass http://hangman_backend/;
        include /etc/nginx/proxy_params;
       }
}

}