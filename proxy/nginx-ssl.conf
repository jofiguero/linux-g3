events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 100M;

    # Upstreams
    upstream moodle_backend {
        server moodle:80;
    }
    upstream wordpress_backend {
        server wordpress:80;
    }
    upstream hangman_backend {
        server hangman:3000;
    }

    # Bloque HTTP
    server {
        listen 80;
        server_name grupo3.ifigueroap.cl;
        
        root /usr/share/nginx/html;
        index index.html;

        # Certbot
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirección a HTTPS
        location / {
            return 301 https://$host:8443$request_uri;
        }
    }

    # Bloque HTTPS (Puerto 443 interno)
    server {
       listen 443 ssl;
       server_name grupo3.ifigueroap.cl;

       ssl_certificate /etc/letsencrypt/live/grupo3.ifigueroap.cl/fullchain.pem;
       ssl_certificate_key /etc/letsencrypt/live/grupo3.ifigueroap.cl/privkey.pem;

       # Headers comunes para proxy (Reemplazo de proxy_params)
       proxy_set_header Host $host;
       proxy_set_header X-Real-IP $remote_addr;
       proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
       proxy_set_header X-Forwarded-Proto https;

       # Moodle
       location /moodle/ {
            proxy_pass http://moodle_backend/moodle/;
            proxy_redirect http:// https://;
            # Headers específicos repetidos por seguridad
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

       # Wordpress
       location /wp/ {
            proxy_pass http://wordpress_backend/;
            proxy_redirect http:// https://;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
       }

       # App Hangman
       location /app/ {
            proxy_pass http://hangman_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
       }
       
       # Landing Page
       location = / {
            try_files $uri $uri/ /index.html;
       }
    }
}