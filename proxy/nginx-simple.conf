events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 100M;

    # Upstreams
    upstream moodle_backend {
        server moodle:80;
    }
    upstream wordpress_backend {
        server wordpress:80;
    }
    upstream hangman_backend {
        server hangman:3000;
    }

    # Servidor HTTP en puerto 80 (el proxy maestro maneja SSL)
    server {
        listen 80;
        server_name grupo3.ifigueroap.cl;
        
        root /usr/share/nginx/html;
        index index.html;

        # Headers para saber que viene desde HTTPS
        add_header X-Backend-Server "grupo3-proxy" always;

        # Landing Page
        location = / {
            try_files /index.html =404;
        }

        # Moodle
        location /moodle/ {
            proxy_pass http://moodle_backend/moodle/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_redirect off;
        }

        # WordPress
        location /wp/ {
            proxy_pass http://wordpress_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_redirect off;
        }

        # App Hangman
        location /app/ {
            proxy_pass http://hangman_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_redirect off;
        }

        # Health check
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
}
